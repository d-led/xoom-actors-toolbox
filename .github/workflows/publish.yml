name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          settings-path: ${{ github.workspace }}

      # A tag publishes that tag's version; main publishes a snapshot of it.
      - name: Decide the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-SNAPSHOT.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ steps.version.outputs.value }}
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.version.outputs.value }}" -DgenerateBackupPoms=false
          mvn -B deploy -s "${{ github.workspace }}/settings.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
